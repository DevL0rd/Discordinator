<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">DotBot — your Discord bot, within reach of dot</title>
  <desc id="description">A quiet constellation of messages passes through a locked bridge to dot. Authenticated MCP, deliberate requests, bounded context. Motion stops when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#11152b"/><stop offset="1" stop-color="#161c38"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#a99aff"/><stop offset="1" stop-color="#69ead7"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#7967d8" stop-opacity=".3"/><stop offset="1" stop-color="#7967d8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7886b9" opacity=".17"/></pattern>
    <style>
      .ink{fill:#f4f3ff}.muted{fill:#adb8d8}.line{fill:none;stroke:#52648e;stroke-width:1.5}.packet{fill:#7ae7d8;animation:travel 6s ease-in-out infinite}.late{animation-delay:-3s}.orbit{transform-origin:922px 156px;animation:orbit 38s linear infinite}.pulse{animation:pulse 6s ease-in-out infinite}.star{fill:#a99aff;animation:pulse 6s ease-in-out infinite}.type{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      @keyframes travel{0%,12%{transform:translateX(0);opacity:.25}48%{opacity:1}85%,100%{transform:translateX(225px);opacity:.25}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.packet,.orbit,.pulse,.star{animation:none}.packet{opacity:.8}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#sky)"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="url(#grid)" stroke="#434d72" stroke-opacity=".55"/>
  <ellipse cx="940" cy="164" rx="294" ry="218" fill="url(#halo)"/>
  <g class="type">
    <rect x="55" y="49" width="188" height="28" rx="14" fill="#a99aff" fill-opacity=".12" stroke="#a99aff" stroke-opacity=".35"/>
    <circle cx="72" cy="63" r="3" fill="#72e5d1"/>
    <text x="85" y="68" fill="#c6bcff" font-size="11" font-weight="650" letter-spacing="2">DISCORD × MCP</text>
    <text x="51" y="168" class="ink" font-size="88" font-weight="750" letter-spacing="-5">DotBot<tspan fill="#73e6d4">.</tspan></text>
    <text x="56" y="211" class="muted" font-size="23">Your Discord bot, within reach of dot.</text>
    <path d="M56 239H484" stroke="url(#accent)" stroke-opacity=".45"/>
    <text x="56" y="269" class="muted" font-size="13" letter-spacing=".5">Deliberate requests. Authenticated control. Bounded context.</text>
  </g>
  <g class="line">
    <path d="M633 103H682Q712 103 712 133V155H764M633 207H682Q712 207 712 177V155H764M826 155H1007"/>
    <circle cx="922" cy="156" r="68" stroke-dasharray="2 9" opacity=".6"/>
    <circle cx="922" cy="156" r="98" stroke-dasharray="50 20 2 20" opacity=".28"/>
    <path d="M838 266H1038" stroke-dasharray="2 6" opacity=".5"/>
  </g>
  <g class="orbit"><circle cx="922" cy="58" r="4" fill="#a99aff"/><circle cx="922" cy="254" r="3" fill="#71e5d4"/></g>
  <g class="type">
    <g transform="translate(579 81)"><rect width="55" height="44" rx="12" fill="#232a4b" stroke="#8b83da"/><path d="M14 14H41M14 22H33M14 30H37" stroke="#c0b8ff" stroke-width="2" stroke-linecap="round"/></g>
    <g transform="translate(579 185)"><rect width="55" height="44" rx="12" fill="#232a4b" stroke="#638b9b"/><path d="M16 12H32L40 20V33H16Z M32 12V21H40" fill="none" stroke="#8ce3d7" stroke-width="1.8"/></g>
    <rect x="764" y="119" width="62" height="72" rx="18" fill="#242946" stroke="#b1a0ff" stroke-width="1.5"/>
    <path d="M785 150V141A10 10 0 0 1 805 141V150" fill="none" stroke="#ccbfff" stroke-width="2"/>
    <rect x="779" y="148" width="32" height="24" rx="7" fill="#a99aff" fill-opacity=".25" stroke="#c2b2ff"/>
    <circle cx="795" cy="158" r="2.5" fill="#ded5ff"/><path d="M795 160V165" stroke="#ded5ff" stroke-width="2"/>
    <circle cx="1039" cy="155" r="32" fill="#24354a" stroke="#75e6d5" stroke-width="1.5"/>
    <circle class="pulse" cx="1039" cy="155" r="12" fill="#7becd9"/>
    <text x="606" y="251" text-anchor="middle" class="muted" font-size="12">DISCORD</text>
    <text x="795" y="216" text-anchor="middle" class="muted" font-size="12">POLICY GATE</text>
    <text x="1039" y="216" text-anchor="middle" class="muted" font-size="12">DOT</text>
    <text x="942" y="296" text-anchor="middle" fill="#97a6cf" font-size="11" letter-spacing="2">HEADLESS BY DESIGN</text>
  </g>
  <circle class="packet" cx="839" cy="155" r="3"/><circle class="packet late" cx="839" cy="155" r="3"/>
  <circle class="star" cx="1132" cy="72" r="2"/><circle class="star late" cx="548" cy="302" r="2"/>
</svg>
